plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation files('lib/junit-4.13.jar', 'lib/hamcrest-core-1.3.jar')
}

test {
    useJUnit()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
